name: Plugins

on:
  pull_request:
    paths: ["plugins/**", "tools/**", ".github/workflows/plugins.yml"]
  push:
    branches: [main]
    paths: ["plugins/**", "tools/**", ".github/workflows/plugins.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate manifests and check plugins/index.json is current
        run: python tools/build_index.py --check
